name: CI

on:
  push:
    branches: [main, rust]
  pull_request:

env:
  IMAGE: ghcr.io/analogic/phpsafepass

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release --locked

  static:
    name: Static musl binary
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the rolling release
    steps:
      - uses: actions/checkout@v4
      - name: Add musl target
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Verify it is static
        run: |
          file target/x86_64-unknown-linux-musl/release/phpsafepass | grep -q static
          ls -lh target/x86_64-unknown-linux-musl/release/phpsafepass
      - name: Name the artifact
        run: cp target/x86_64-unknown-linux-musl/release/phpsafepass phpsafepass-x86_64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: phpsafepass-x86_64-linux
          path: phpsafepass-x86_64-linux
      # On pushes to main, attach the binary to a rolling `edge` release so
      # it has a stable download URL (no version tags, always the latest).
      - name: Publish to the rolling 'edge' release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create edge --prerelease --title edge \
            --notes "Rolling static build of the latest main. Not versioned." \
            --target "$GITHUB_SHA" 2>/dev/null || true
          gh release upload edge phpsafepass-x86_64-linux --clobber

  image:
    name: Docker image (edge)
    needs: [test, static]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
