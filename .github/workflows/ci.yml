name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (static)
        run: make static

      - name: Verify static binary
        run: |
          file build/phpsafepass-static | grep -q 'statically linked'
          ls -lh build/phpsafepass-static

      - name: Test
        run: make test
